[LOGGING]
# File to write logs to. If not specified, log messages will be written to STDOUT/STDERR
log_file=/var/log/aphostd/aphostd.log
# Set the log level. Use '-1' for debug, '0' for info, '1' for error
log_level=-1

[HARDWARE]
# Name of the interface to broadcast on
interface=wlo1
# Driver to use with the interface
driver=nl80211

[AP]
# Name of the network
ssid=Free WiFi
# Band to broadcast on
band=2.4g
# Channel to broadcast on
channel=1
# Security type to use. Can be 'none', 'wpa2-psk', 'wpa2/wpa3', or 'wpa3-personal'
security=none
# Passphrase for the network. Not applicable if security type is 'none'
passphrase=
# Whether or not the network should be visible. Can be 'true' or 'false'
hidden=false

[HOSTAPD]
# Path to the hostapd binary
executable=/usr/sbin/hostapd
# Path to use for the hostapd configuration file
config_file=/etc/hostapd.conf
# Path to use for hostapd's access control list
acl_file=/etc/hostapd.deny
# Event script used to forward events to the daemon
event_script=/etc/aphostd/rsc/event-script.sh
